        <path d="M176 390C154 405 135 428 127 449C117 451 111 458 112 467C113 476 121 481 129 478C138 475 143 467 141 456C147 437 161 419 185 403Z" fill="#EFEADF" stroke="#0B0D12" stroke-width="6" stroke-linejoin="round"/>
        <path d="M124 466C120 469 118 473 119 477M134 466C133 471 135 475 138 478" fill="none" stroke="#0B0D12" stroke-width="4" stroke-linecap="round"/>
        <path d="M114 456C108 455 104 450 105 445" fill="none" stroke="#0B0D12" stroke-width="5" stroke-linecap="round"/>
        <path d="M126 447L139 455" fill="none" stroke="#7E93BE" stroke-width="4" stroke-linecap="round"/>
      </g>

