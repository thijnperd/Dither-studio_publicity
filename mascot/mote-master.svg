      <path d="M160 583H232" opacity="0.72"/>
      <path d="M290 583H354" opacity="0.38"/>
      <path d="M400 583H486"/>
      <path d="M160 576V590M486 576V590" opacity="0.7"/>
      <path d="M246 583H274" opacity="0.2"/>
    </g>

