        <path d="M253 386H262M253 401H260M253 416H262M253 431H260" stroke="#7E93BE" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
        <path d="M236 506H410" stroke="#7E93BE" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

        <g id="mote-pocket">
