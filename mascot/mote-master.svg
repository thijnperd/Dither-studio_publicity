<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="mote-title mote-desc">
  <title id="mote-title">Mote, the Dither Studio press apprentice</title>
  <desc id="mote-desc">An ivory ink drop with a rectangular bite out of its left shoulder, one square ink eye, a lapis loupe set over the other eye, a black printer's apron, a print test strip in its left hand, and one loose out-of-register pixel.</desc>
  <defs>
    <pattern id="mote-halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="2.05" fill="#0B0D12" opacity="0.16"/>
    </pattern>
    <pattern id="mote-lens-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.05" fill="#7E93BE" opacity="0.55"/>
    </pattern>
    <clipPath id="mote-body-clip">
      <path d="M331 82C364 120 405 146 439 184C478 231 496 301 485 378C473 464 403 538 317 548C227 558 158 491 149 400C141 320 168 250 222 192L264 192V146H218C249 129 292 106 331 82Z"/>
    </clipPath>
  </defs>

  <g id="mote">
