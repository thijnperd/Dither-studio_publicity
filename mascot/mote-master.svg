        <path d="M229 453C216 457 208 466 207 477C206 486 211 493 219 496L215 510" fill="none" stroke="#0B0D12" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M229 453C216 457 208 466 207 477C206 486 211 493 219 496L215 510" fill="none" stroke="#7E93BE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
