        <path d="M447 469L459 480M449 485L458 493" fill="none" stroke="#0B0D12" stroke-width="6" stroke-linecap="round"/>
        <path d="M449 471L459 480M450 485L458 492" fill="none" stroke="#7E93BE" stroke-width="1.5" stroke-linecap="round" opacity="0.62"/>
      </g>

      <g id="mote-right-rig">
        <g id="mote-loupe">
          <path d="M449 307L463 329" fill="none" stroke="#0B0D12" stroke-width="14" stroke-linecap="round"/>
          <path d="M454 315L461 326" fill="none" stroke="#7E93BE" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
          <circle cx="466" cy="333" r="7" fill="#0B0D12" stroke="#7E93BE" stroke-width="2"/>
          <circle cx="407" cy="267" r="56" fill="#D6D1C6" stroke="#0B0D12" stroke-width="6"/>
          <circle cx="407" cy="267" r="47" fill="url(#mote-lens-dots)" stroke="#7E93BE" stroke-width="10"/>
          <circle cx="407" cy="267" r="25" fill="#EFEADF" opacity="0.18"/>
          <circle cx="407" cy="267" r="16" fill="#0B0D12"/>
          <path d="M389 250Q396 242 408 240" fill="none" stroke="#EFEADF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
          <circle cx="386" cy="218" r="3" fill="#7E93BE"/>
          <circle cx="449" cy="316" r="3" fill="#7E93BE"/>
        </g>
      </g>

      <g id="mote-spark" transform="rotate(-5 184 138)">
        <rect x="178" y="132" width="28" height="28" fill="#7E93BE"/>
        <rect x="171" y="126" width="28" height="28" fill="#0B0D12"/>
      </g>
    </g>
  </g>
</svg>
