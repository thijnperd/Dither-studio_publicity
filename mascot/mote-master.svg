        <path d="M216 558H278M355 562H423" stroke="#7E93BE" stroke-width="4" stroke-linecap="round" opacity="0.88"/>
      </g>

      <g id="mote-proof-strip" transform="rotate(17 127 469)">
        <path d="M112 461H141V532L134 526L127 533L120 527L112 533Z" fill="#EFEADF" stroke="#0B0D12" stroke-width="4" stroke-linejoin="round"/>
        <rect x="117" y="468" width="19" height="5" fill="#0B0D12"/>
        <circle cx="121" cy="482" r="2" fill="#0B0D12"/>
        <circle cx="128" cy="482" r="2" fill="#0B0D12"/>
        <circle cx="135" cy="482" r="2" fill="#0B0D12"/>
        <rect x="122" y="492" width="10" height="10" fill="#7E93BE"/>
        <path d="M121 510H133M121 516H129" stroke="#0B0D12" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      </g>

