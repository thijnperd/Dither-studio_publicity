            <rect x="338" y="419" width="50" height="33" fill="#EFEADF"/>
            <rect x="344" y="425" width="6" height="6" fill="#0B0D12"/>
            <path d="M354 430H376M354 436H369" stroke="#0B0D12" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
          </g>
          <path d="M330 438H390L386 490H335Z" fill="#121722" stroke="#7E93BE" stroke-width="2"/>
          <path d="M341 451H377" stroke="#7E93BE" stroke-width="2" opacity="0.45"/>
