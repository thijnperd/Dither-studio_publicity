<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; }
  body { display: grid; place-items: center; background: transparent; }
  body[data-bg="dark"] { background: #0B0D12; }
  img { display: block; width: var(--size); height: var(--size); }
</style>
</head>
<body>
<img id="mote" alt="">
<script>
  const params = new URLSearchParams(location.search);
  const src = params.get('src') || '../mote-master.svg';
  const size = Number(params.get('size')) || 512;
  document.documentElement.style.setProperty('--size', `${size}px`);
  document.body.style.width = `${size}px`;
  document.body.style.height = `${size}px`;
  document.body.dataset.bg = params.get('bg') || 'transparent';
  document.getElementById('mote').src = src;
</script>
</body>
</html>
